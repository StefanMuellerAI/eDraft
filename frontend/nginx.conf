# Nginx: statischer Server für das Frontend und Reverse Proxy für das Backend
# (§7.4). Ein einziger interner Einstiegspunkt: /api/* -> FastAPI, Rest -> SPA.

server {
    listen 80;
    server_name _;

    # Upload-Limit für den Konverter-Endpunkt (mit EDRAFT_MAX_UPLOAD_MB abstimmen).
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:8000;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
